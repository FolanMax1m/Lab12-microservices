events {
    worker_connections 1024;
}

http {
    # ТЕПЕР RESOLVER ТУТ (це правильно)
    resolver 8.8.8.8;

    server {
        listen 80;

        location /api/users {
            proxy_pass https://users-service-production-5f85.up.railway.app;
            proxy_ssl_server_name on;
        }

        location /api/products {
            proxy_pass https://product-service-production-00cf.up.railway.app;
            proxy_ssl_server_name on;
        }

        location /api/orders {
            proxy_pass https://orders-service-production-1056.up.railway.app;
            proxy_ssl_server_name on;
        }

        location / {
            return 200 '{"status": "Gateway is running"}';
            add_header Content-Type application/json;
        }
    }
}